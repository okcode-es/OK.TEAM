services:
  db:
    image: postgres:16-alpine
    container_name: okteam-local-db
    profiles:
      - local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: okteam_dev_password
      POSTGRES_DB: okteam
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    volumes:
      - okteam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okteam"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: okteam-backend
    env_file:
      - path: .env
        required: false
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - okteam_docs_data:/app/.local_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://placeholder.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-placeholder}
        VITE_DEV_AUTH_ENABLED: ${VITE_DEV_AUTH_ENABLED:-false}
    container_name: okteam-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  okteam_pgdata:
  okteam_docs_data:
